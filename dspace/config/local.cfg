##########################
# BANCO DE DADOS         #
##########################
# db.password é injetado via env var DB_PASSWORD no compose
db.url = jdbc:postgresql://dspacedb:5432/dspace
db.username = dspace

##########################
# SOLR                   #
##########################
solr.server = http://dspacesolr:8983/solr

##########################
# NOME DO SITE           #
##########################
dspace.name = Repositório Institucional UFJF
dspace.server.url = https://testedspace.ufjf.br/server
dspace.ui.url = https://testedspace.ufjf.br

##########################
# PROXY / REDE           #
##########################
# Subnet da rede Docker (deve bater com networks.dspacenet no compose)
proxies.trusted.ipranges = 172.23.0.0/24

##########################
# FUNCIONALIDADES        #
##########################
ldn.enabled = true

##########################
# IDIOMA E TIMEZONE      #
##########################
default.language = pt_BR
default.timezone = America/Sao_Paulo

##########################
# BANCO DE DADOS         #
##########################
# Pool de conexões
db.maxconnections = 30
db.minconnections = 5

##########################
# EMAIL / SMTP           #
##########################
mail.server = smtp.cgco.ufjf.br
mail.server.port = 25
mail.server.username =
mail.server.password =
mail.server.protocol = smtp
mail.admin = admin@localhost
mail.from.address = noreply@localhost
feedback.recipient = admin@localhost

##########################
# SOLR ADICIONAL         #
##########################
# Cores de estatísticas e autoridade não cobertos pelo solr__P__server
statistics.solr.server = http://dspacesolr:8983/solr/statistics
authority.solr.server = http://dspacesolr:8983/solr/authority

##########################
# REVERSE PROXY          #
##########################
useProxies = true
server.use-forward-headers = true

##########################
# CORS                   #
##########################
rest.cors.allowed-origins = ${dspace.ui.url}
rest.cors.allow-credentials = true
rest.cors.allowed-methods = GET,POST,PUT,PATCH,DELETE,OPTIONS
rest.cors.allowed-headers = *

##########################
# HANDLE                 #
##########################
handle.canonical.prefix = ${dspace.server.url}/handle/

##########################
# OAI-PMH               #
##########################
oai.enable = true

##########################
# AUTENTICAÇÃO           #
##########################
plugin.sequence.org.dspace.authenticate.AuthenticationMethod = \
 org.dspace.authenticate.PasswordAuthentication
authentication-password.login.specialgroup =

##########################
# FUNCIONALIDADES        #
##########################
entities.enabled = true
orcid.enabled = false
identifier.doi.enable = false
authentication-ldap.enable = false
swordv2-server.enabled = true

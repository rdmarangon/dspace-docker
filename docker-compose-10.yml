services:
    dspacedb:
        image: postgres:16
        container_name: dspacedb
        restart: unless-stopped
        environment:
            TZ: "${TZ}"
            POSTGRES_USER: "${DB_USER:-dspace}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
            POSTGRES_DB: "${DB_NAME:-dspace}"
        volumes:
            - ${INITDB_DIR}/00_create_roles.sql:/docker-entrypoint-initdb.d/00_create_roles.sql
            - ${DB_INIT_SQL}:/docker-entrypoint-initdb.d/dspace_76.sql
            - ${POSTGRES_DATA}:/var/lib/postgresql/data
        networks:
            - dspacenet
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-dspace} -d ${DB_NAME:-dspace}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    dspacesolr:
        image: dspace/dspace-solr:dspace-10.1
        container_name: dspacesolr
        restart: unless-stopped
        volumes:
            - ${SOLR_DATA}:/var/solr/data
        networks:
            - dspacenet
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -sf http://localhost:8983/solr/admin/info/system",
                ]
            interval: 15s
            timeout: 10s
            retries: 10

    dspace:
        image: dspace/dspace:dspace-10.1
        container_name: dspace
        restart: unless-stopped
        depends_on:
            dspacedb:
                condition: service_healthy
            dspacesolr:
                condition: service_healthy
        environment:
            # Segredos injetados via env var (não ficam em local.cfg)
            db__P__password: "${DB_PASSWORD}"
        volumes:
            - ${ASSETSTORE}:/dspace/assetstore
            - ${DSPACE_DIR}/config/local.cfg:/dspace/config/local.cfg:ro
            - ${DSPACE_DIR}/sitemaps:/dspace/sitemaps
        networks:
            - dspacenet
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -sf http://localhost:8080/server/api/authn/status",
                ]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 120s

    dspace-cli:
        image: dspace/dspace-cli:dspace-10.1
        container_name: dspace-cli
        depends_on:
            dspacedb:
                condition: service_healthy
        environment:
            db__P__url: "jdbc:postgresql://dspacedb:5432/${DB_NAME:-dspace}"
            db__P__username: "${DB_USER:-dspace}"
            db__P__password: "${DB_PASSWORD}"
            dspace__P__dir: /dspace
            solr__P__server: "${DSPACE_SOLR_URL:-http://dspacesolr:8983/solr}"
        volumes:
            - ${ASSETSTORE}:/dspace/assetstore
        networks:
            - dspacenet
        profiles: ["cli"]

    dspace-ui:
        image: dspace/dspace-angular:dspace-10.1
        container_name: dspace-ui
        restart: unless-stopped
        depends_on:
            dspace:
                condition: service_healthy
        environment:
            NODE_ENV: production
        volumes:
            # OBRIGATÓRIO: substitui o serve.ts da imagem, que usa --configuration development
            # e não tem --allowed-hosts all (nginx seria rejeitado com "Invalid Host header").
            # Nosso serve.ts usa --configuration production e --allowed-hosts all.
            - ${DSPACE_UI_DIR}/serve.ts:/app/scripts/serve.ts:ro
            - ${DSPACE_UI_DIR}/config:/app/config
        extra_hosts:
            - "${DSPACE_HOSTNAME}:host-gateway"
        networks:
            - dspacenet

    nginx:
        image: nginx:stable-alpine
        container_name: dspace-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ${NGINX_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
            - ${NGINX_DIR}/conf.d:/etc/nginx/conf.d:ro
            - ${NGINX_DIR}/certs:/etc/nginx/certs:ro
            - ${NGINX_DIR}/snippets:/etc/nginx/snippets:ro
            - ${DSPACE_DIR}/sitemaps:/var/www/sitemaps:ro
        depends_on:
            - dspace
            - dspace-ui
        networks:
            - dspacenet

networks:
    dspacenet:
        ipam:
            config:
                - subnet: "${DSPACE_TRUSTED_IP_RANGES}"

# Bloquear Spring Boot Actuator
location ~* ^/server/actuator {
    include snippets/security/444.conf;
}

# Rate limiting no endpoint de autenticação
location = /server/api/authn/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass $upstream_api/server/api/authn/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

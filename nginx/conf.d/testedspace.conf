server {
    listen 80;
    server_name testedspace.ufjf.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name testedspace.ufjf.br;

    ssl_certificate     /etc/nginx/certs/testedspace.ufjf.br.crt;
    ssl_certificate_key /etc/nginx/certs/testedspace.ufjf.br.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include snippets/rules/common.conf;
    include snippets/rules/dspace.conf;
    include snippets/rules/headers.conf;
    include snippets/rules/bad-bots.conf;

    set $upstream_ui  http://dspace-ui:4000;
    set $upstream_api http://dspace:8080;

    # WebSocket do Angular CLI (live reload em dev)
    location /ng-cli-ws {
        proxy_pass $upstream_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Redirect legacy /jspui — DSpace 6.3 JSPUI → DSpace 9 Angular
    location ~ ^/jspui/(.*)$ {
        return 301 /$1;
    }

    # Sitemaps — URLs na raiz são as referenciadas pelo robots.txt gerado pelo Angular
    location = /sitemap_index.xml {
        alias /var/www/sitemaps/sitemap_index.xml;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap_index.html {
        alias /var/www/sitemaps/sitemap_index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~ ^/sitemap\d+\.(xml|html)$ {
        root /var/www/sitemaps;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Frontend Angular
    location / {
        proxy_pass $upstream_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend DSpace REST API
    # IMPORTANTE: proxy_pass sem URI/path para evitar reescrita que gera barra dupla (/server//api/...)
    location /server {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512M;
        proxy_read_timeout 300s;
    }
}
